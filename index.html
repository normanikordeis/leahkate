let cid=eras[0]?.id,idx=-1,list=[],playing=false,filt='';
const a=document.getElementById('a'),pf=document.getElementById('pf'),pb=document.getElementById('pb');
const tc=document.getElementById('tc'),tt=document.getElementById('tt');
const ip=document.getElementById('ip'),iu=document.getElementById('iu');

function re(){document.getElementById('el').innerHTML=eras.map(e=>`<div class="ei ${e.id===cid?'on':''}" data-id="${e.id}"><div class="dot" style="background:${e.color}"></div><div><div class="en">${e.name}</div><div class="ec">${e.tracks.length} tracks</div></div></div>`).join('');
document.querySelectorAll('.ei').forEach(el=>el.onclick=()=>{cid=el.dataset.id;filt='';document.getElementById('q').value='';re();rt()})}
function qc(q){if(!q)return'q-na';q=q.toLowerCase();if(q.includes('lossless')||q.includes('cd'))return'q-cd';if(q.includes('high'))return'q-hq';if(q.includes('low'))return'q-lq';if(q.includes('record'))return'q-rc';return'q-na'}
function rt(){const e=eras.find(x=>x.id===cid);if(!e)return;document.getElementById('et').textContent=e.name;document.getElementById('es').textContent=e.description||'';
let tr=e.tracks;if(filt){const f=filt.toLowerCase();tr=tr.filter(t=>t.title.toLowerCase().includes(f)||(t.notes||'').toLowerCase().includes(f)||(t.type||'').toLowerCase().includes(f))}
list=tr;document.getElementById('tb').innerHTML=tr.map((t,i)=>`<tr class="tr ${idx===i&&playing?'pl':''}" data-i="${i}"><td class="tn">${i+1}</td><td><div class="tt">${t.title}</div><div class="tnotes" title="${(t.notes||'').replace(/"/g,'&quot;')}">${t.notes||''}</div></td><td><span class="tb">${t.type||'—'}</span></td><td><span class="qb ${qc(t.quality)}">${t.quality||'—'}</span></td><td style="color:var(--mut);font-size:.85rem">${t.length||'—'}</td><td><button class="pb" data-i="${i}"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button></td></tr>`).join('');
document.querySelectorAll('.tr').forEach(r=>r.onclick=e=>{if(!e.target.closest('.pb'))pt(+r.dataset.i)});
document.querySelectorAll('.pb').forEach(b=>b.onclick=e=>{e.stopPropagation();pt(+b.dataset.i)})}
function pt(i){const t=list[i];if(!t)return;idx=i;document.getElementById('pti').textContent=t.title;document.getElementById('par').textContent='Leah Kate · '+(t.type||'Demo');document.getElementById('pa').textContent=t.title[0].toUpperCase();
if(t.url){a.src=t.url;a.play().then(()=>{playing=true;ui()}).catch(()=>{playing=false;ui()})}else{a.removeAttribute('src');playing=false;ui();tc.textContent='0:00';tt.textContent=t.length||'0:00';pf.style.width='0%'}rt()}
function tg(){if(idx<0){if(list.length)pt(0);return}if(playing){a.pause();playing=false}else{a.play().then(()=>playing=true).catch(()=>{})}ui();rt()}
function ui(){ip.style.display=playing?'none':'block';iu.style.display=playing?'block':'none'}
function f(s){if(!s||isNaN(s))return'0:00';return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
function nx(){if(list.length)pt((idx+1)%list.length)}function pv(){if(list.length)pt(idx<=0?list.length-1:idx-1)}
document.getElementById('bpl').onclick=tg;document.getElementById('bn').onclick=nx;document.getElementById('bp').onclick=pv;
document.getElementById('q').oninput=e=>{filt=e.target.value;rt()};
a.ontimeupdate=()=>{if(a.duration){pf.style.width=(a.currentTime/a.duration*100)+'%';tc.textContent=f(a.currentTime)}};
a.onloadedmetadata=()=>tt.textContent=f(a.duration);a.onended=nx;
a.onplay=()=>{playing=true;ui()};a.onpause=()=>{playing=false;ui()};
pb.onclick=e=>{if(!a.duration)return;const r=pb.getBoundingClientRect();a.currentTime=((e.clientX-r.left)/r.width)*a.duration};
document.getElementById('vol').oninput=e=>a.volume=e.target.value;a.volume=.85;
document.onkeydown=e=>{if(e.target.tagName==='INPUT')return;if(e.code==='Space'){e.preventDefault();tg()}if(e.code==='ArrowRight')nx();if(e.code==='ArrowLeft')pv()};
document.getElementById('tot').textContent=eras.reduce((s,e)=>s+e.tracks.length,0)+' tracks';
re();rt();
</script>
