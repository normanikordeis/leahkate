<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leah Kate — Unreleased Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink-300: #f9a8d4; --pink-400: #f472b6; --pink-500: #ec4899; --pink-600: #db2777; --pink-700: #be185d;
      --bg: #0f0a0d; --bg-elevated: #1a1218; --border: rgba(236,72,153,0.15);
      --text: #fdf2f8; --text-muted: #c4a0b4; --text-dim: #8a6a7a; --radius-sm: 8px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text); height:100vh; overflow:hidden; display:flex; flex-direction:column; }
    header { height:64px; background:linear-gradient(90deg,var(--bg-elevated),#1f1420); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 24px; flex-shrink:0; }
    .logo { display:flex; align-items:center; gap:12px; font-weight:700; font-size:1.15rem; }
    .logo-icon { width:36px; height:36px; background:linear-gradient(135deg,var(--pink-500),var(--pink-700)); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; box-shadow:0 4px 12px rgba(236,72,153,0.35); }
    .header-meta { display:flex; align-items:center; gap:16px; font-size:0.85rem; color:var(--text-muted); }
    .badge { background:rgba(236,72,153,0.15); color:var(--pink-300); padding:4px 10px; border-radius:999px; font-size:0.75rem; font-weight:500; }
    .main { display:flex; flex:1; overflow:hidden; }
    .sidebar { width:280px; background:var(--bg-elevated); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; }
    .sidebar-header { padding:20px 20px 12px; font-size:0.7rem; font-weight:600; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-dim); }
    .era-list { flex:1; overflow-y:auto; padding:0 12px 20px; }
    .era-item { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--radius-sm); cursor:pointer; transition:all .15s; margin-bottom:4px; border:1px solid transparent; }
    .era-item:hover { background:rgba(236,72,153,0.08); }
    .era-item.active { background:rgba(236,72,153,0.15); border-color:rgba(236,72,153,0.3); }
    .era-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
    .era-name { font-weight:500; font-size:0.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .era-count { font-size:0.75rem; color:var(--text-dim); margin-top:2px; }
    .content { flex:1; display:flex; flex-direction:column; overflow:hidden; }
    .content-header { padding:28px 32px 20px; border-bottom:1px solid var(--border); background:linear-gradient(180deg,rgba(236,72,153,0.06),transparent); }
    .content-title { font-size:1.75rem; font-weight:700; letter-spacing:-0.03em; margin-bottom:6px; }
    .content-sub { color:var(--text-muted); font-size:0.9rem; }
    .search-bar { margin-top:14px; }
    .search-bar input { width:100%; max-width:360px; background:rgba(255,255,255,0.06); border:1px solid var(--border); border-radius:8px; padding:10px 14px; color:var(--text); font-size:0.9rem; outline:none; }
    .search-bar input:focus { border-color:var(--pink-500); }
    .track-list-container { flex:1; overflow-y:auto; padding:12px 24px 120px; }
    .track-table { width:100%; border-collapse:collapse; }
    .track-table th { text-align:left; font-size:0.7rem; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-dim); padding:12px 16px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:10; }
    .track-row { transition:background .12s; cursor:pointer; }
    .track-row:hover { background:rgba(236,72,153,0.06); }
    .track-row.playing { background:rgba(236,72,153,0.12); }
    .track-row td { padding:13px 16px; border-bottom:1px solid rgba(236,72,153,0.06); font-size:0.9rem; }
    .track-num { width:40px; color:var(--text-dim); font-variant-numeric:tabular-nums; }
    .track-title { font-weight:500; }
    .track-notes { font-size:0.75rem; color:var(--text-dim); max-width:380px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .quality-badge, .type-badge { display:inline-block; padding:3px 8px; border-radius:6px; font-size:0.7rem; font-weight:500; }
    .quality-cd { background:rgba(52,211,153,0.15); color:#6ee7b7; }
    .quality-hq { background:rgba(96,165,250,0.15); color:#93c5fd; }
    .quality-lq { background:rgba(251,191,36,0.15); color:#fcd34d; }
    .quality-rec { background:rgba(167,139,250,0.15); color:#c4b5fd; }
    .quality-na { background:rgba(156,163,175,0.15); color:#9ca3af; }
    .type-badge { background:rgba(236,72,153,0.12); color:var(--pink-300); }
    .play-btn { width:32px; height:32px; border-radius:50%; border:none; background:transparent; color:var(--text-muted); cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .play-btn:hover { background:rgba(236,72,153,0.2); color:var(--pink-300); }
    .player { position:fixed; bottom:0; left:0; right:0; height:90px; background:linear-gradient(180deg,#1a1218,#140e12); border-top:1px solid var(--border); display:flex; align-items:center; padding:0 24px; gap:24px; z-index:200; box-shadow:0 -8px 32px rgba(0,0,0,0.5); }
    .player-track { display:flex; align-items:center; gap:14px; width:280px; flex-shrink:0; }
    .player-art { width:56px; height:56px; border-radius:8px; background:linear-gradient(135deg,var(--pink-600),var(--pink-700)); display:flex; align-items:center; justify-content:center; font-size:22px; box-shadow:0 4px 12px rgba(236,72,153,0.3); }
    .player-title { font-weight:600; font-size:0.95rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .player-artist { font-size:0.8rem; color:var(--text-muted); margin-top:2px; }
    .player-controls { flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; max-width:600px; }
    .controls-row { display:flex; align-items:center; gap:16px; }
    .ctrl-btn { width:36px; height:36px; border-radius:50%; border:none; background:transparent; color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .ctrl-btn:hover { color:var(--pink-300); }
    .ctrl-btn.play-main { width:44px; height:44px; background:var(--pink-500); color:white; box-shadow:0 4px 16px rgba(236,72,153,0.4); }
    .ctrl-btn.play-main:hover { background:var(--pink-400); transform:scale(1.05); }
    .progress-row { display:flex; align-items:center; gap:10px; width:100%; }
    .time { font-size:0.75rem; color:var(--text-dim); min-width:40px; font-variant-numeric:tabular-nums; }
    .progress-bar { flex:1; height:5px; background:rgba(255,255,255,0.08); border-radius:999px; cursor:pointer; overflow:hidden; }
    .progress-fill { height:100%; background:linear-gradient(90deg,var(--pink-500),var(--pink-400)); border-radius:999px; width:0%; }
    .player-volume { display:flex; align-items:center; gap:10px; width:160px; justify-content:flex-end; }
    .volume-slider { width:90px; height:4px; -webkit-appearance:none; background:rgba(255,255,255,0.1); border-radius:999px; outline:none; }
    .volume-slider::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:var(--pink-400); cursor:pointer; }
    ::-webkit-scrollbar { width:8px; } ::-webkit-scrollbar-thumb { background:rgba(236,72,153,0.25); border-radius:4px; }
    @media (max-width:900px) { .sidebar{width:220px;} .player-volume{display:none;} }
    @media (max-width:700px) { .sidebar{display:none;} .player-track{width:140px;} }
  </style>
</head>
<body>

    let currentEraId = eras[0]?.id, currentTrackIndex = -1, currentEraTracks = [], isPlaying = false, filterText = '';
    const audio = document.getElementById('audio');
    const progressFill = document.getElementById('progress-fill');
    const progressBar = document.getElementById('progress-bar');
    const timeCurrent = document.getElementById('time-current');
    const timeTotal = document.getElementById('time-total');
    const iconPlay = document.getElementById('icon-play');
    const iconPause = document.getElementById('icon-pause');

    function renderEras() {
      document.getElementById('era-list').innerHTML = eras.map(e => `
        <div class="era-item ${e.id===currentEraId?'active':''}" data-id="${e.id}">
          <div class="era-dot" style="background:${e.color}"></div>
          <div><div class="era-name">${e.name}</div><div class="era-count">${e.tracks.length} tracks</div></div>
        </div>`).join('');
      document.querySelectorAll('.era-item').forEach(el => el.onclick = () => {
        currentEraId = el.dataset.id; filterText=''; document.getElementById('search').value='';
        renderEras(); renderTracks();
      });
    }
    function qClass(q) {
      if (!q) return 'quality-na';
      q = q.toLowerCase();
      if (q.includes('lossless')||q.includes('cd')) return 'quality-cd';
      if (q.includes('high')) return 'quality-hq';
      if (q.includes('low')) return 'quality-lq';
      if (q.includes('record')) return 'quality-rec';
      return 'quality-na';
    }
    function renderTracks() {
      const era = eras.find(e => e.id === currentEraId);
      if (!era) return;
      document.getElementById('era-title').textContent = era.name;
      document.getElementById('era-sub').textContent = era.description || '';
      let tracks = era.tracks;
      if (filterText) {
        const f = filterText.toLowerCase();
        tracks = tracks.filter(t => t.title.toLowerCase().includes(f) || (t.notes||'').toLowerCase().includes(f) || (t.type||'').toLowerCase().includes(f));
      }
      currentEraTracks = tracks;
      document.getElementById('track-body').innerHTML = tracks.map((t,i) => `
        <tr class="track-row ${currentTrackIndex===i&&isPlaying?'playing':''}" data-i="${i}">
          <td class="track-num">${i+1}</td>
          <td><div class="track-title">${t.title}</div><div class="track-notes" title="${(t.notes||'').replace(/"/g,'&quot;')}">${t.notes||''}</div></td>
          <td><span class="type-badge">${t.type||'—'}</span></td>
          <td><span class="quality-badge ${qClass(t.quality)}">${t.quality||'—'}</span></td>
          <td style="color:var(--text-muted);font-size:0.85rem">${t.length||'—'}</td>
          <td><button class="play-btn" data-i="${i}"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button></td>
        </tr>`).join('');
      document.querySelectorAll('.track-row').forEach(r => r.onclick = e => { if(!e.target.closest('.play-btn')) playTrack(+r.dataset.i); });
      document.querySelectorAll('.play-btn').forEach(b => b.onclick = e => { e.stopPropagation(); playTrack(+b.dataset.i); });
    }
    function playTrack(i) {
      const t = currentEraTracks[i]; if (!t) return;
      currentTrackIndex = i;
      document.getElementById('player-title').textContent = t.title;
      document.getElementById('player-artist').textContent = 'Leah Kate · ' + (t.type||'Demo');
      document.getElementById('player-art').textContent = t.title[0].toUpperCase();
      if (t.url) {
        audio.src = t.url;
        audio.play().then(()=>{isPlaying=true; updateIcon();}).catch(()=>{isPlaying=false; updateIcon();});
      } else {
        audio.removeAttribute('src'); isPlaying=false; updateIcon();
        timeCurrent.textContent='0:00'; timeTotal.textContent=t.length||'0:00'; progressFill.style.width='0%';
      }
      renderTracks();
    }
    function togglePlay() {
      if (currentTrackIndex < 0) { if (currentEraTracks.length) playTrack(0); return; }
      if (isPlaying) { audio.pause(); isPlaying=false; } else { audio.play().then(()=>isPlaying=true).catch(()=>{}); }
      updateIcon(); renderTracks();
    }
    function updateIcon() { iconPlay.style.display = isPlaying?'none':'block'; iconPause.style.display = isPlaying?'block':'none'; }
    function fmt(s) { if(!s||isNaN(s)) return '0:00'; return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'); }
    function next() { if(currentEraTracks.length) playTrack((currentTrackIndex+1)%currentEraTracks.length); }
    function prev() { if(currentEraTracks.length) playTrack(currentTrackIndex<=0?currentEraTracks.length-1:currentTrackIndex-1); }

    document.getElementById('btn-play').onclick = togglePlay;
    document.getElementById('btn-next').onclick = next;
    document.getElementById('btn-prev').onclick = prev;
    document.getElementById('search').oninput = e => { filterText = e.target.value; renderTracks(); };
    audio.ontimeupdate = () => { if(audio.duration){ progressFill.style.width=(audio.currentTime/audio.duration*100)+'%'; timeCurrent.textContent=fmt(audio.currentTime); } };
    audio.onloadedmetadata = () => timeTotal.textContent = fmt(audio.duration);
    audio.onended = next;
    audio.onplay = () => { isPlaying=true; updateIcon(); };
    audio.onpause = () => { isPlaying=false; updateIcon(); };
    progressBar.onclick = e => { if(!audio.duration) return; const r=progressBar.getBoundingClientRect(); audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration; };
    document.getElementById('volume').oninput = e => audio.volume = e.target.value;
    audio.volume = 0.85;
    document.onkeydown = e => {
      if (e.target.tagName==='INPUT') return;
      if (e.code==='Space'){e.preventDefault();togglePlay();}
      if (e.code==='ArrowRight') next();
      if (e.code==='ArrowLeft') prev();
    };
    document.getElementById('total-count').textContent = eras.reduce((s,e)=>s+e.tracks.length,0) + ' tracks';
    renderEras(); renderTracks();
  </script>
