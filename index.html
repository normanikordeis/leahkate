<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leah Kate — Unreleased Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink-50: #fdf2f8;
      --pink-100: #fce7f3;
      --pink-200: #fbcfe8;
      --pink-300: #f9a8d4;
      --pink-400: #f472b6;
      --pink-500: #ec4899;
      --pink-600: #db2777;
      --pink-700: #be185d;
      --pink-800: #9d174d;
      --pink-900: #831843;
      --bg: #0f0a0d;
      --bg-elevated: #1a1218;
      --bg-card: #221820;
      --border: rgba(236, 72, 153, 0.15);
      --text: #fdf2f8;
      --text-muted: #c4a0b4;
      --text-dim: #8a6a7a;
      --accent: #ec4899;
      --accent-hover: #f472b6;
      --success: #34d399;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      height: 64px;
      background: linear-gradient(90deg, var(--bg-elevated), #1f1420);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--pink-500), var(--pink-700));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 4px 12px rgba(236, 72, 153, 0.35);
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .badge {
      background: rgba(236, 72, 153, 0.15);
      color: var(--pink-300);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    /* Main layout */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: var(--bg-elevated);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 20px 20px 12px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
    }

    .era-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 12px 20px;
    }

    .era-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s ease;
      margin-bottom: 4px;
      border: 1px solid transparent;
    }

    .era-item:hover {
      background: rgba(236, 72, 153, 0.08);
    }

    .era-item.active {
      background: rgba(236, 72, 153, 0.15);
      border-color: rgba(236, 72, 153, 0.3);
    }

    .era-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .era-info {
      flex: 1;
      min-width: 0;
    }

    .era-name {
      font-weight: 500;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .era-count {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: 2px;
    }

    /* Content area */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    .content-header {
      padding: 28px 32px 20px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(236, 72, 153, 0.06), transparent);
    }

    .content-title {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }

    .content-sub {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .track-list-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px 24px 120px;
    }

    .track-table {
      width: 100%;
      border-collapse: collapse;
    }

    .track-table th {
      text-align: left;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
    }

    .track-row {
      transition: background 0.12s ease;
      cursor: pointer;
    }

    .track-row:hover {
      background: rgba(236, 72, 153, 0.06);
    }

    .track-row.playing {
      background: rgba(236, 72, 153, 0.12);
    }

    .track-row td {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(236, 72, 153, 0.06);
      font-size: 0.9rem;
    }

    .track-num {
      width: 40px;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
    }

    .track-title-cell {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .track-title {
      font-weight: 500;
    }

    .track-notes {
      font-size: 0.75rem;
      color: var(--text-dim);
      max-width: 420px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .quality-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 500;
    }

    .quality-cd { background: rgba(52, 211, 153, 0.15); color: #6ee7b7; }
    .quality-hq { background: rgba(96, 165, 250, 0.15); color: #93c5fd; }
    .quality-lq { background: rgba(251, 191, 36, 0.15); color: #fcd34d; }
    .quality-rec { background: rgba(167, 139, 250, 0.15); color: #c4b5fd; }
    .quality-na { background: rgba(156, 163, 175, 0.15); color: #9ca3af; }

    .type-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 500;
      background: rgba(236, 72, 153, 0.12);
      color: var(--pink-300);
    }

    .play-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .play-btn:hover {
      background: rgba(236, 72, 153, 0.2);
      color: var(--pink-300);
    }

    .track-row.playing .play-btn {
      color: var(--pink-400);
    }

    /* Player bar */
    .player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 90px;
      background: linear-gradient(180deg, #1a1218, #140e12);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 24px;
      z-index: 200;
      box-shadow: 0 -8px 32px rgba(0,0,0,0.5);
    }

    .player-track {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 280px;
      flex-shrink: 0;
    }

    .player-art {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--pink-600), var(--pink-800));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
    }

    .player-info {
      min-width: 0;
    }

    .player-title {
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-artist {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .player-controls {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      max-width: 600px;
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .ctrl-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .ctrl-btn:hover {
      color: var(--pink-300);
    }

    .ctrl-btn.play-main {
      width: 44px;
      height: 44px;
      background: var(--pink-500);
      color: white;
      box-shadow: 0 4px 16px rgba(236, 72, 153, 0.4);
    }

    .ctrl-btn.play-main:hover {
      background: var(--pink-400);
      transform: scale(1.05);
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .time {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
      min-width: 40px;
    }

    .progress-bar {
      flex: 1;
      height: 5px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--pink-500), var(--pink-400));
      border-radius: 999px;
      width: 0%;
      transition: width 0.1s linear;
    }

    .progress-bar:hover .progress-fill {
      background: linear-gradient(90deg, var(--pink-400), var(--pink-300));
    }

    .player-volume {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 160px;
      flex-shrink: 0;
      justify-content: flex-end;
    }

    .volume-slider {
      width: 90px;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255,255,255,0.1);
      border-radius: 999px;
      outline: none;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--pink-400);
      cursor: pointer;
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-dim);
      gap: 12px;
      padding: 40px;
    }

    .empty-state svg {
      opacity: 0.3;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(236, 72, 153, 0.25);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(236, 72, 153, 0.4);
    }

    /* Responsive */
    @media (max-width: 900px) {
      .sidebar { width: 220px; }
      .player-track { width: 180px; }
      .player-volume { display: none; }
    }

    @media (max-width: 700px) {
      .sidebar { display: none; }
      .player-track { width: 140px; }
      .content-header { padding: 20px 16px 16px; }
      .track-list-container { padding: 8px 12px 120px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-icon">LK</div>
      <span>Leah Kate Tracker</span>
    </div>
    <div class="header-meta">
      <span class="badge">Unreleased Archive</span>
      <span id="total-count">0 tracks</span>
    </div>
  </header>

  <div class="main">
    <aside class="sidebar">
      <div class="sidebar-header">Eras & Projects</div>
      <div class="era-list" id="era-list"></div>
    </aside>

    <section class="content">
      <div class="content-header">
        <h1 class="content-title" id="era-title">Select an Era</h1>
        <p class="content-sub" id="era-sub">Choose a project from the sidebar to browse tracks</p>
      </div>
      <div class="track-list-container">
        <table class="track-table">
          <thead>
            <tr>
              <th style="width:48px">#</th>
              <th>Title</th>
              <th>Type</th>
              <th>Quality</th>
              <th>Length</th>
              <th style="width:48px"></th>
            </tr>
          </thead>
          <tbody id="track-body"></tbody>
        </table>
        <div class="empty-state" id="empty-state" style="display:none">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
          </svg>
          <p>No playable tracks in this era</p>
        </div>
      </div>
    </section>
  </div>

  <div class="player">
    <div class="player-track">
      <div class="player-art" id="player-art">♪</div>
      <div class="player-info">
        <div class="player-title" id="player-title">No track selected</div>
        <div class="player-artist" id="player-artist">Leah Kate</div>
      </div>
    </div>

    <div class="player-controls">
      <div class="controls-row">
        <button class="ctrl-btn" id="btn-prev" title="Previous">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="ctrl-btn play-main" id="btn-play" title="Play/Pause">
          <svg id="icon-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icon-pause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="ctrl-btn" id="btn-next" title="Next">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
      <div class="progress-row">
        <span class="time" id="time-current">0:00</span>
        <div class="progress-bar" id="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <span class="time" id="time-total">0:00</span>
      </div>
    </div>

    <div class="player-volume">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="opacity:0.7">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
      </svg>
      <input type="range" class="volume-slider" id="volume" min="0" max="1" step="0.01" value="0.85">
    </div>
  </div>

    const timeTotal = document.getElementById('time-total');
    const btnPlay = document.getElementById('btn-play');
    const iconPlay = document.getElementById('icon-play');
    const iconPause = document.getElementById('icon-pause');
    const volumeSlider = document.getElementById('volume');

    // ============ RENDER ============
    function renderEras() {
      const list = document.getElementById('era-list');
      list.innerHTML = eras.map(era => `
        <div class="era-item ${era.id === currentEraId ? 'active' : ''}" data-id="${era.id}">
          <div class="era-dot" style="background:${era.color}"></div>
          <div class="era-info">
            <div class="era-name">${era.name}</div>
            <div class="era-count">${era.tracks.length} tracks</div>
          </div>
        </div>
      `).join('');

      list.querySelectorAll('.era-item').forEach(el => {
        el.addEventListener('click', () => {
          currentEraId = el.dataset.id;
          renderEras();
          renderTracks();
        });
      });
    }

    function qualityClass(q) {
      if (!q) return 'quality-na';
      const lower = q.toLowerCase();
      if (lower.includes('lossless') || lower.includes('cd')) return 'quality-cd';
      if (lower.includes('high') || lower.includes('hq')) return 'quality-hq';
      if (lower.includes('low') || lower.includes('lq')) return 'quality-lq';
      if (lower.includes('record')) return 'quality-rec';
      return 'quality-na';
    }

    function renderTracks() {
      const era = eras.find(e => e.id === currentEraId);
      if (!era) return;

      document.getElementById('era-title').textContent = era.name;
      document.getElementById('era-sub').textContent = era.description;
      currentEraTracks = era.tracks;

      const body = document.getElementById('track-body');
      const empty = document.getElementById('empty-state');

      if (era.tracks.length === 0) {
        body.innerHTML = '';
        empty.style.display = 'flex';
        return;
      }
      empty.style.display = 'none';

      body.innerHTML = era.tracks.map((t, i) => `
        <tr class="track-row ${currentTrackIndex === i && isPlaying ? 'playing' : ''}" data-index="${i}">
          <td class="track-num">${i + 1}</td>
          <td>
            <div class="track-title-cell">
              <span class="track-title">${t.title}</span>
              <span class="track-notes" title="${t.notes || ''}">${t.notes || ''}</span>
            </div>
          </td>
          <td><span class="type-badge">${t.type || '—'}</span></td>
          <td><span class="quality-badge ${qualityClass(t.quality)}">${t.quality || '—'}</span></td>
          <td class="track-meta">${t.length || '—'}</td>
          <td>
            <button class="play-btn" data-index="${i}" title="Play">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </button>
          </td>
        </tr>
      `).join('');

      body.querySelectorAll('.track-row').forEach(row => {
        row.addEventListener('click', (e) => {
          if (e.target.closest('.play-btn')) return;
          const idx = parseInt(row.dataset.index);
          playTrack(idx);
        });
      });

      body.querySelectorAll('.play-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = parseInt(btn.dataset.index);
          playTrack(idx);
        });
      });
    }

    function updateTotalCount() {
      const total = eras.reduce((sum, e) => sum + e.tracks.length, 0);
      document.getElementById('total-count').textContent = `${total} tracks`;
    }

    // ============ PLAYER ============
    function playTrack(index) {
      const track = currentEraTracks[index];
      if (!track) return;

      currentTrackIndex = index;

      document.getElementById('player-title').textContent = track.title;
      document.getElementById('player-artist').textContent = `Leah Kate · ${track.type || 'Demo'}`;
      document.getElementById('player-art').textContent = track.title.charAt(0).toUpperCase();

      if (track.url) {
        audio.src = track.url;
        audio.play().then(() => {
          isPlaying = true;
          updatePlayIcon();
        }).catch(err => {
          console.warn('Playback failed (link may require direct access or CORS):', err);
          isPlaying = false;
          updatePlayIcon();
          // Still update UI so user sees the track is selected
        });
      } else {
        audio.removeAttribute('src');
        isPlaying = false;
        updatePlayIcon();
        timeCurrent.textContent = '0:00';
        timeTotal.textContent = track.length || '0:00';
        progressFill.style.width = '0%';
      }

      renderTracks(); // refresh playing highlight
    }

    function togglePlay() {
      if (currentTrackIndex < 0) {
        if (currentEraTracks.length > 0) playTrack(0);
        return;
      }
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
      } else {
        audio.play().then(() => { isPlaying = true; }).catch(() => {});
      }
      updatePlayIcon();
      renderTracks();
    }

    function updatePlayIcon() {
      iconPlay.style.display = isPlaying ? 'none' : 'block';
      iconPause.style.display = isPlaying ? 'block' : 'none';
    }

    function formatTime(sec) {
      if (!sec || isNaN(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    function nextTrack() {
      if (currentEraTracks.length === 0) return;
      const next = (currentTrackIndex + 1) % currentEraTracks.length;
      playTrack(next);
    }

    function prevTrack() {
      if (currentEraTracks.length === 0) return;
      const prev = currentTrackIndex <= 0 ? currentEraTracks.length - 1 : currentTrackIndex - 1;
      playTrack(prev);
    }

    // Event listeners
    btnPlay.addEventListener('click', togglePlay);
    document.getElementById('btn-next').addEventListener('click', nextTrack);
    document.getElementById('btn-prev').addEventListener('click', prevTrack);

    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      const pct = (audio.currentTime / audio.duration) * 100;
      progressFill.style.width = pct + '%';
      timeCurrent.textContent = formatTime(audio.currentTime);
    });

    audio.addEventListener('loadedmetadata', () => {
      timeTotal.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('ended', () => {
      nextTrack();
    });

    audio.addEventListener('play', () => { isPlaying = true; updatePlayIcon(); });
    audio.addEventListener('pause', () => { isPlaying = false; updatePlayIcon(); });

    progressBar.addEventListener('click', (e) => {
      if (!audio.duration) return;
      const rect = progressBar.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      audio.currentTime = pct * audio.duration;
    });

    volumeSlider.addEventListener('input', () => {
      audio.volume = volumeSlider.value;
    });
    audio.volume = 0.85;

    // Keyboard
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      } else if (e.code === 'ArrowRight') {
        nextTrack();
      } else if (e.code === 'ArrowLeft') {
        prevTrack();
      }
    });

    // Init
    renderEras();
    renderTracks();
    updateTotalCount();
  </script>
</body>
</html>
