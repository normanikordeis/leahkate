function render(){$('#nav').innerHTML=NAV.map(([k,n])=>`<button class="tab ${S.page==k||(S.page.startsWith('era:')&&k=='eras')?'on':''}" data-p="${k}">${n}</button>`).join('');
 const v=$('#view'),p=S.page,q=S.q,foot=`<footer>Unofficial fan-made archive, not affiliated with Leah Kate. No audio is hosted here; links point to external hosts. Data adapted from the supplied tracker (editors: fromtheend, electrocuted, plsticlqd). Updated 7/12/26.</footer>`;
 if(p=='home'){const c=k=>S.T.filter(t=>t.status==k).length;v.innerHTML=`<div class="hero"><div><h1>${esc(S.cfg.name)}</h1><p class="lead">The unreleased archive, from the scrapped debut EP through <i>Impulse</i>, <i>Used to This</i>, <i>What Just Happened?</i>, <i>Alive and Unwell</i>, <i>Super Over</i> and <i>Genius</i>. Tap a photo slot to add your own pictures.</p><div class="chips"><span class="chip">${S.T.length} tracks</span><span class="chip">${c('Full')} full</span><span class="chip">${c('Snippet')+c('Partial')} snippets &amp; partials</span><span class="chip">${c('Confirmed Not Available')} unavailable</span></div><button class="btn pri" data-p="all">Browse tracks</button> <button class="btn" data-a="shufall">Shuffle play</button></div><div class="photos">${S.photos.map((u,i)=>`<div class="ph" style="${u?`background-image:url(${u})`:''}">${u?'':'LK'}<label>${u?'Change':'Add photo'}<input type="file" accept="image/*" data-ph="${i}" hidden></label></div>`).join('')}</div></div><h2>Eras</h2><div class="cards">${ERAS.map(eraCard).join('')}</div>${foot}`;return}
 if(p=='eras'){v.innerHTML=`<h2 style="margin-top:0">Eras</h2><div class="cards">${ERAS.map(eraCard).join('')}</div>${foot}`;return}
 if(p=='stats'){const cols={Full:'#6fdca8',Partial:'#f1c36b',Snippet:'#7fb0ff','Confirmed Not Available':'#ff7a8c',Rumored:'#c9a3b6'};v.innerHTML=`<h2 style="margin-top:0">Stats</h2><div class="bar">${Object.keys(cols).map(k=>`<i title="${k}" style="flex:${S.T.filter(t=>t.status==k).length};background:${cols[k]}"></i>`).join('')}</div><div class="chips">${Object.keys(cols).map(k=>`<span class="chip">${k}: ${S.T.filter(t=>t.status==k).length}</span>`).join('')}</div><h2>By era</h2><div class="chips">${ERAS.map(e=>`<span class="chip">${esc(e[0])}: ${S.T.filter(t=>t.era==e[0]).length}</span>`).join('')}</div>${foot}`;return}
 const l=list(),title=p.startsWith('era:')?p.slice(4):p=='fav'?'Favorites':'All tracks';
 v.innerHTML=`<h2 style="margin-top:0">${esc(title)} <small style="color:var(--mu);font:14px var(--f)">${l.length} entries</small></h2>${S.view=='list'?`<div class="row hd"><span></span><span>Title</span><span>Era</span><span>Producer</span><span>Time</span><span>Status</span><span>Quality</span><span>Link</span></div>${l.map(t=>row(t,q)).join('')}`:`<div class="cards">${l.map(gcard).join('')}</div>`}${l.length?'':'<p class="lead">Nothing matches. Clear the search or filters, or add a track.</p>'}${foot}`}
// player
const au=$('#au');
function setBar(t){$('#pt').textContent=t?t.title+(t.ver?' ['+t.ver+']':''):'Nothing playing';$('#ps').textContent=t?`${t.era} · ${t.status} · ${t.q}`:'Pick a track';const p=t?photoFor(eraIdx(t.era)):'';$('#pa').style.backgroundImage=p?`url(${p})`:''}
function play(id){const t=byId(id);if(!t)return;S.cur=id;setBar(t);$('#msg').innerHTML='';const u=audioOf(t);
 if(isNA(t)||!u){au.pause();$('#msg').innerHTML=isNA(t)?'Confirmed not available':`No direct audio yet. ${t.url?`<a href="${esc(t.url)}" target="_blank" rel="noopener noreferrer" style="color:var(--a2)">Open source ↗</a> · `:''}<a href="#" data-a="attach" data-id="${t.id}" style="color:var(--a2)">Attach audio</a>`;render();return}
 au.src=u;au.playbackRate=+$('#sp').value;au.play().catch(()=>{});S.rec=[id,...S.rec.filter(x=>x!=id)].slice(0,20);LS.s('rec',S.rec);render()}
function step(d,auto){const src=S.queue.length?S.queue:list().map(t=>t.id);let i=src.indexOf(S.cur);if(!src.length)return;
 for(let n=0;n<src.length;n++){i=S.shuf&&d>0?Math.floor(Math.random()*src.length):(i+d+src.length)%src.length;const t=byId(src[i]);if(t&&!isNA(t)&&audioOf(t)){play(t.id);return}}$('#msg').textContent='No playable audio in this list. Add direct audio URLs or attach files.'}
au.onended=()=>S.rep==2?(au.currentTime=0,au.play()):step(1,true);
au.onerror=()=>{if(au.getAttribute('src')){const t=byId(S.cur);$('#msg').innerHTML=`Couldn’t play this link. It may be a web page, not an audio file. ${t&&t.url?`<a href="${esc(t.url)}" target="_blank" rel="noopener noreferrer" style="color:var(--a2)">Open source ↗</a>`:''}`}};
au.ontimeupdate=()=>{$('#ct').textContent=fmt(au.currentTime);$('#rt').textContent='-'+fmt(au.duration-au.currentTime);$('#sk').value=au.duration?au.currentTime/au.duration*1000:0};
au.onplay=()=>{$('#pp').textContent='⏸';$('#pl').classList.add('playing')};au.onpause=()=>{$('#pp').textContent='▶';$('#pl').classList.remove('playing')};
const toggle=()=>{if(S.cur&&au.src){au.paused?au.play():au.pause()}else{const t=list().find(t=>!isNA(t)&&audioOf(t));t?play(t.id):$('#msg').textContent='No playable audio yet. Open a track and add a direct audio URL or file.'}};
// sheets
const open=h=>{$('#sc').innerHTML=h;$('#sheet').classList.add('open')},shut=()=>$('#sheet').classList.remove('open');
function detail(id){const t=byId(id);if(!t)return;S.sel=id;open(`<h2 style="margin-top:0">${esc(t.mark)} ${esc(t.title)}</h2><dl><dt>Version</dt><dd>${esc(t.ver||'—')}</dd><dt>Era</dt><dd>${esc(t.era)}</dd><dt>Type</dt><dd>${esc(t.type)}</dd><dt>Producer</dt><dd>${esc(t.prod||'Not listed')}</dd><dt>Length</dt><dd>${esc(t.len||'—')}</dd><dt>Leaked</dt><dd>${esc(t.date||'—')}</dd><dt>Status</dt><dd><span class="badge s-${stc(t.status)}">${esc(t.status)}</span></dd><dt>Quality</dt><dd>${esc(t.q)}</dd><dt>Notes</dt><dd>${esc(t.notes||'—')}</dd></dl><p style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" data-a="dplay">Play</button>${t.url?`<a class="btn" href="${esc(t.url)}" target="_blank" rel="noopener noreferrer">Open source ↗</a>`:''}<button class="btn" data-a="dq">Add to queue</button><button class="btn" data-a="dfav">${S.fav.has(id)?'Unfavorite':'Favorite'}</button><button class="btn" data-a="attach" data-id="${id}">Attach audio file</button><button class="btn" data-a="edit">Edit</button><button class="btn" data-a="del">Delete</button></p>`)}
const fld=(k,l,v='',tag='input')=>`<div><label>${l}</label><${tag} data-k="${k}" ${tag=='input'?`value="${esc(v)}"`:''}>${tag=='textarea'?esc(v):''}${tag=='textarea'?'</textarea>':''}</div>`;
function edit(id){const t=id?byId(id):{era:ERAS[0][0],type:'Throwaway',status:'Full',q:'CDQ'};S.sel=id||null;
 open(`<h2 style="margin-top:0">${id?'Edit track':'Add track'}</h2><div class="g2">${fld('title','Title',t.title||'')}${fld('ver','Version (V1…)',t.ver||'')}<div><label>Era</label><select data-k="era">${ERAS.map(e=>`<option ${e[0]==t.era?'selected':''}>${esc(e[0])}</option>`).join('')}</select></div>${fld('prod','Producer',t.prod||'')}<div><label>Status</label><select data-k="status">${['Full','Partial','Snippet','Confirmed Not Available','Rumored'].map(s=>`<option ${s==t.status?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Quality</label><select data-k="q">${['Lossless','CDQ','HQ','LQ','Recording','Unknown'].map(s=>`<option ${s==t.q?'selected':''}>${s}</option>`).join('')}</select></div>${fld('len','Length',t.len||'')}${fld('date','Leak date',t.date||'')}${fld('type','Type',t.type||'')}${fld('mark','Marker (★ 🏆)',t.mark||'')}</div>${fld('url','Source link',t.url||'')}${fld('audio','Direct audio URL (.mp3, .wav, .m4a…) for the player',t.audio||'')}${fld('notes','Notes',t.notes||'','textarea')}<p><button class="btn pri" data-a="saveT">Save</button> <button class="btn" data-a="shut">Cancel</button></p>`)}
function settings(){const c=S.cfg;open(`<h2 style="margin-top:0">Customize</h2><div class="g2"><div><label>Accent color</label><input type="color" data-c="accent" value="${c.accent}"></div><div><label>Display name</label><input data-c="name" value="${esc(c.name)}"></div><div><label>Theme</label><select data-c="theme"><option value="dark" ${c.theme=='dark'?'selected':''}>Dark pink</option><option value="light" ${c.theme=='light'?'selected':''}>Light blush</option></select></div><div><label>Typeface</label><select data-c="font"><option value="dm" ${c.font=='dm'?'selected':''}>Fraunces + DM Sans</option><option value="serif" ${c.font=='serif'?'selected':''}>Classic serif</option><option value="mono" ${c.font=='mono'?'selected':''}>Mono</option></select></div></div><label>Corner roundness: ${c.radius}px</label><input type="range" data-c="radius" min="0" max="28" value="${c.radius}"><label><input type="checkbox" data-c="photosOnCards" ${c.photosOnCards?'checked':''} style="width:auto"> Use my photos on era cards and the player</label><p style="display:flex;gap:6px;flex-wrap:wrap">${['#ff4fa3','#ff77c8','#e0368a','#ff8fb1','#c44cff'].map(x=>`<button class="btn" data-a="pick" data-v="${x}" style="border-color:${x};color:${x}">${x}</button>`).join('')}</p><p style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-a="exp">Export library</button><label class="btn">Import library<input type="file" id="imp" accept=".json" hidden></label><button class="btn" data-a="photoURL">Add photo by URL</button><button class="btn" data-a="reset">Reset all</button></p><p class="lead">Import accepts JSON exported here, or an array of track objects (title, era, ver, prod, status, q, len, date, url, audio). Everything is stored only in this browser.</p>`)}
function queueUI(){open(`<h2 style="margin-top:0">Queue</h2>${S.queue.map((id,i)=>`<div style="display:flex;gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid var(--bd)"><span style="flex:1">${esc(byId(id)?.title)}</span><button class="btn" data-qa="up" data-i="${i}">↑</button><button class="btn" data-qa="rm" data-i="${i}">✕</button></div>`).join('')||'<p class="lead">Queue is empty. Use “Add to queue” on a track.</p>'}<p><button class="btn" data-qa="clr">Clear</button></p>`)}
async function toData(f){const im=await createImageBitmap(f),k=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.82)}
let pend=null;
document.addEventListener('click',e=>{const el=e.target.closest('[data-a],[data-p],[data-era],[data-qa],.row,.card[data-id]');if(!el)return;const a=el.dataset.a;if(a=='src')return e.stopPropagation();
 if(el.dataset.p){S.page=el.dataset.p;render();return $('#view').scrollTop=0}
 if(el.dataset.era){S.page='era:'+el.dataset.era;render();return $('#view').scrollTop=0}
 if(el.dataset.qa){const k=el.dataset.qa,i=+el.dataset.i,q=S.queue;if(k=='rm')q.splice(i,1);if(k=='up'&&i>0)[q[i-1],q[i]]=[q[i],q[i-1]];if(k=='clr')S.queue=[];return queueUI()}
 if(a=='play'){e.stopPropagation();const id=el.closest('[data-id]').dataset.id;return S.cur==id&&au.src&&!au.paused?au.pause():S.cur==id&&au.src?au.play():play(id)}
 if(a=='fav'){e.stopPropagation();const id=el.closest('[data-id]').dataset.id;S.fav.has(id)?S.fav.delete(id):S.fav.add(id);LS.s('fav',[...S.fav]);return render()}
 if(a=='shufall'){S.shuf=1;$('#sh').classList.add('on');return step(1)}
 if(a=='attach'){e.preventDefault();pend=el.dataset.id||S.sel;return $('#af').click()}
 if(a=='shut')return shut();if(a=='dplay'){shut();return play(S.sel)}
 if(a=='dq'){S.queue.push(S.sel);return shut()}if(a=='dfav'){S.fav.has(S.sel)?S.fav.delete(S.sel):S.fav.add(S.sel);LS.s('fav',[...S.fav]);render();return detail(S.sel)}
 if(a=='edit')return edit(S.sel);
 if(a=='del'){if(confirm('Delete this track?')){S.T=S.T.filter(t=>t.id!=S.sel);save();shut();render()}return}
 if(a=='saveT'){const o={};document.querySelectorAll('#sc [data-k]').forEach(x=>o[x.dataset.k]=x.value.trim());if(!o.title)return alert('Add a title.');
  if(S.sel)Object.assign(byId(S.sel),o);else S.T.push(Object.assign({id:'u'+Date.now()},o));save();shut();return render()}
 if(a=='pick'){S.cfg.accent=el.dataset.v;applyCfg();return settings()}
 if(a=='exp'){const x=document.createElement('a');x.href=URL.createObjectURL(new Blob([JSON.stringify({tracks:S.T,favorites:[...S.fav],cfg:S.cfg},null,1)],{type:'application/json'}));x.download='leah-kate-tracker.json';return x.click()}
 if(a=='photoURL'){const u=prompt('Image URL');if(u){const i=S.photos.findIndex(x=>!x);S.photos[i<0?0:i]=u;LS.s('photos',S.photos);render()}return}
 if(a=='reset'){if(confirm('Reset tracks, photos and settings?')){Object.keys(localStorage).filter(k=>k.startsWith('lk_')).forEach(k=>localStorage.removeItem(k));location.reload()}return}
 if(el.dataset.id&&(el.classList.contains('row')||el.classList.contains('card')))detail(el.dataset.id)});
document.addEventListener('change',async e=>{const t=e.target,f=t.files?.[0];
 if(t.dataset.c){let v=t.type=='checkbox'?t.checked:t.type=='range'?+t.value:t.value;S.cfg[t.dataset.c]=v;applyCfg();render();if(t.type=='range')settings();return}
 if(!f)return;
 if(t.dataset.ph!=null){S.photos[+t.dataset.ph]=await toData(f);LS.s('photos',S.photos);render()}
 if(t.id=='af'&&pend){S.local[pend]=URL.createObjectURL(f);const id=pend;pend=null;play(id)}
 if(t.id=='imp'){try{const j=JSON.parse(await f.text()),arr=Array.isArray(j)?j:j.tracks;if(!Array.isArray(arr))throw 0;S.T=arr.map((x,i)=>Object.assign({id:'i'+i+Date.now(),era:ERAS[0][0],title:'Untitled',ver:'',prod:'',type:'',status:'Full',q:'CDQ',len:'',date:'',url:'',audio:'',mark:'',notes:''},x));if(j.cfg)Object.assign(S.cfg,j.cfg);save();applyCfg();shut();render()}catch{alert('That file isn’t a valid library.')}}});
let tm;$('#q').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{S.q=e.target.value;if(S.q&&!['all','fav'].includes(S.page)&&!S.page.startsWith('era:'))S.page='all';render()},120)};
$('#fs').onchange=e=>{S.st=e.target.value;if(!['all','fav'].includes(S.page)&&!S.page.startsWith('era:'))S.page='all';render()};$('#so').onchange=e=>{S.sort=e.target.value;render()};
$('#vm').onclick=()=>{S.view=S.view=='list'?'grid':'list';LS.s('view',S.view);$('#vm').textContent=S.view=='list'?'Grid':'List';render()};
$('#add').onclick=()=>edit();$('#set').onclick=settings;$('#bq').onclick=queueUI;$('#sheet').onclick=e=>{if(e.target.id=='sheet')shut()};
$('#pp').onclick=toggle;$('#nx').onclick=()=>step(1);$('#pv').onclick=()=>step(-1);
$('#sh').onclick=()=>{S.shuf=!S.shuf;$('#sh').classList.toggle('on',S.shuf)};$('#rp').onclick=()=>{S.rep=(S.rep+1)%3;$('#rp').classList.toggle('on',S.rep>0);$('#rp').textContent=S.rep==2?'⟲1':'⟲'};
$('#sk').oninput=e=>{if(au.duration)au.currentTime=e.target.value/1000*au.duration};$('#vo').oninput=e=>au.volume=e.target.value/100;$('#sp').onchange=e=>au.playbackRate=+e.target.value;
document.addEventListener('keydown',e=>{const tg=e.target.tagName;if(e.key=='Escape')return shut();if(tg=='INPUT'&&e.target.type!='range'||tg=='SELECT'||tg=='TEXTAREA')return;if(e.target.closest('button,a,.row')&&e.key==' ')return;
 const m={' ':toggle,arrowleft:()=>au.currentTime-=5,arrowright:()=>au.currentTime+=5,n:()=>step(1),p:()=>step(-1),'/':()=>$('#q').focus()}[e.key.toLowerCase()];if(m){e.preventDefault();m()}});
$('#view').addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.dataset.id)detail(e.target.dataset.id)});
au.volume=.8;$('#vm').textContent=S.view=='list'?'Grid':'List';applyCfg();render();
</script></body></html>
