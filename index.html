<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leah Kate — Unreleased Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink-50: #fdf2f8; --pink-100: #fce7f3; --pink-200: #fbcfe8; --pink-300: #f9a8d4;
      --pink-400: #f472b6; --pink-500: #ec4899; --pink-600: #db2777; --pink-700: #be185d;
      --pink-800: #9d174d; --pink-900: #831843;
      --bg: #0f0a0d; --bg-elevated: #1a1218; --bg-card: #221820;
      --border: rgba(236, 72, 153, 0.15);
      --text: #fdf2f8; --text-muted: #c4a0b4; --text-dim: #8a6a7a;
      --accent: #ec4899; --radius: 12px; --radius-sm: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
      display: flex; flex-direction: column;
    }
    header {
      height: 64px; background: linear-gradient(90deg, var(--bg-elevated), #1f1420);
      border-bottom: 1px solid var(--border); display: flex; align-items: center;
      justify-content: space-between; padding: 0 24px; flex-shrink: 0; z-index: 100;
    }
    .logo { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 1.15rem; letter-spacing: -0.02em; }
    .logo-icon {
      width: 36px; height: 36px; background: linear-gradient(135deg, var(--pink-500), var(--pink-700));
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; box-shadow: 0 4px 12px rgba(236, 72, 153, 0.35);
    }
    .header-meta { display: flex; align-items: center; gap: 16px; font-size: 0.85rem; color: var(--text-muted); }
    .badge { background: rgba(236, 72, 153, 0.15); color: var(--pink-300); padding: 4px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 500; }
    .main { display: flex; flex: 1; overflow: hidden; }
    .sidebar {
      width: 280px; background: var(--bg-elevated); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; flex-shrink: 0;
    }
    .sidebar-header { padding: 20px 20px 12px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); }
    .era-list { flex: 1; overflow-y: auto; padding: 0 12px 20px; }
    .era-item {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--radius-sm);
      cursor: pointer; transition: all 0.15s ease; margin-bottom: 4px; border: 1px solid transparent;
    }
    .era-item:hover { background: rgba(236, 72, 153, 0.08); }
    .era-item.active { background: rgba(236, 72, 153, 0.15); border-color: rgba(236, 72, 153, 0.3); }
    .era-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .era-info { flex: 1; min-width: 0; }
    .era-name { font-weight: 500; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .era-count { font-size: 0.75rem; color: var(--text-dim); margin-top: 2px; }
    .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
    .content-header {
      padding: 28px 32px 20px; border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(236, 72, 153, 0.06), transparent);
    }
    .content-title { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 6px; }
    .content-sub { color: var(--text-muted); font-size: 0.9rem; }
    .track-list-container { flex: 1; overflow-y: auto; padding: 12px 24px 120px; }
    .track-table { width: 100%; border-collapse: collapse; }
    .track-table th {
      text-align: left; font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--text-dim); padding: 12px 16px;
      border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 10;
    }
    .track-row { transition: background 0.12s ease; cursor: pointer; }
    .track-row:hover { background: rgba(236, 72, 153, 0.06); }
    .track-row.playing { background: rgba(236, 72, 153, 0.12); }
    .track-row td { padding: 14px 16px; border-bottom: 1px solid rgba(236, 72, 153, 0.06); font-size: 0.9rem; }
    .track-num { width: 40px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
    .track-title-cell { display: flex; flex-direction: column; gap: 3px; }
    .track-title { font-weight: 500; }
    .track-notes { font-size: 0.75rem; color: var(--text-dim); max-width: 420px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-meta { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; }
    .quality-badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 500; }
    .quality-cd { background: rgba(52, 211, 153, 0.15); color: #6ee7b7; }
    .quality-hq { background: rgba(96, 165, 250, 0.15); color: #93c5fd; }
    .quality-lq { background: rgba(251, 191, 36, 0.15); color: #fcd34d; }
    .quality-rec { background: rgba(167, 139, 250, 0.15); color: #c4b5fd; }
    .quality-na { background: rgba(156, 163, 175, 0.15); color: #9ca3af; }
    .type-badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 500; background: rgba(236, 72, 153, 0.12); color: var(--pink-300); }
    .play-btn {
      width: 32px; height: 32px; border-radius: 50%; border: none; background: transparent;
      color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.15s ease;
    }
    .play-btn:hover { background: rgba(236, 72, 153, 0.2); color: var(--pink-300); }
    .track-row.playing .play-btn { color: var(--pink-400); }
    .player {
      position: fixed; bottom: 0; left: 0; right: 0; height: 90px;
      background: linear-gradient(180deg, #1a1218, #140e12); border-top: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 24px; gap: 24px; z-index: 200;
      box-shadow: 0 -8px 32px rgba(0,0,0,0.5);
    }
    .player-track { display: flex; align-items: center; gap: 14px; width: 280px; flex-shrink: 0; }
    .player-art {
      width: 56px; height: 56px; border-radius: 8px;
      background: linear-gradient(135deg, var(--pink-600), var(--pink-800));
      display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
    }
    .player-info { min-width: 0; }
    .player-title { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-artist { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
    .player-controls { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: 600px; }
    .controls-row { display: flex; align-items: center; gap: 16px; }
    .ctrl-btn {
      width: 36px; height: 36px; border-radius: 50%; border: none; background: transparent;
      color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.15s ease;
    }
    .ctrl-btn:hover { color: var(--pink-300); }
    .ctrl-btn.play-main {
      width: 44px; height: 44px; background: var(--pink-500); color: white;
      box-shadow: 0 4px 16px rgba(236, 72, 153, 0.4);
    }
    .ctrl-btn.play-main:hover { background: var(--pink-400); transform: scale(1.05); }
    .progress-row { display: flex; align-items: center; gap: 10px; width: 100%; }
    .time { font-size: 0.75rem; color: var(--text-dim); font-variant-numeric: tabular-nums; min-width: 40px; }
    .progress-bar {
      flex: 1; height: 5px; background: rgba(255,255,255,0.08); border-radius: 999px;
      cursor: pointer; position: relative; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, var(--pink-500), var(--pink-400));
      border-radius: 999px; width: 0%; transition: width 0.1s linear;
    }
    .player-volume { display: flex; align-items: center; gap: 10px; width: 160px; flex-shrink: 0; justify-content: flex-end; }
    .volume-slider {
      width: 90px; height: 4px; -webkit-appearance: none; appearance: none;
      background: rgba(255,255,255,0.1); border-radius: 999px; outline: none;
    }
    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
      background: var(--pink-400); cursor: pointer;
    }
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-dim); gap: 12px; padding: 40px; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(236, 72, 153, 0.25); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(236, 72, 153, 0.4); }
    @media (max-width: 900px) {
      .sidebar { width: 220px; }
      .player-track { width: 180px; }
      .player-volume { display: none; }
    }
    @media (max-width: 700px) {
      .sidebar { display: none; }
      .player-track { width: 140px; }
      .content-header { padding: 20px 16px 16px; }
      .track-list-container { padding: 8px 12px 120px; }
    }
  </style>
</head>

  <header>
    <div class="logo">
      <div class="logo-icon">LK</div>

l": "https://imgur.gg/f/u2JQX7r"}], "color": "#fce7f3", "description": "Latest project era \u2014 Album & Single Demos + Sessions (2023\u20132025)"}, {"id": "unknownsideproject", "name": "Unknown / Side Projects", "tracks": [{"title": "Can't Say No To Me", "notes": "Registered on ASCAP.", "length": "\u2014", "type": "Unknown", "quality": "Not Available", "url": "https://api.pillows.su/api/download/2e47e85d179244c294b251f3c3ede063"}, {"title": "Checklist", "notes": "OG Filename: Checklist v1 Reference demo for Leah.", "length": "1:16", "type": "Ref Track", "quality": "CD Quality", "url": "https://api.pillows.su/api/download/660eb96db1327c32d90aa4f8675d7ae8"}, {"title": "Cool To Be Cruel", "notes": "OG Filename: Cool to be Cruel RMSC 1 Reference demo for Leah.", "length": "2:55", "type": "Ref Track", "quality": "CD Quality", "url": "https://api.pillows.su/api/download/6b4f6891720ab94f6f6c400fde399d19"}, {"title": "Fuck With My Friends", "notes": "Reference demo for Leah.", "length": "\u2014", "type": "Ref Track", "quality": "CD Quality", "url": "https://api.pillows.su/api/download/bc8a3c1c146b64d90039702cf7d6d0f9"}], "color": "#c4a0b4", "description": "Collaborations, reference demos, and uncategorized tracks"}];

    let currentEraId = eras[0]?.id;
    let currentTrackIndex = -1;
    let currentEraTracks = [];
    let isPlaying = false;

    const audio = document.getElementById('audio');
    const progressFill = document.getElementById('progress-fill');
    const progressBar = document.getElementById('progress-bar');
    const timeCurrent = document.getElementById('time-current');
    const timeTotal = document.getElementById('time-total');
    const btnPlay = document.getElementById('btn-play');
    const iconPlay = document.getElementById('icon-play');
    const iconPause = document.getElementById('icon-pause');
    const volumeSlider = document.getElementById('volume');

    function renderEras() {
      const list = document.getElementById('era-list');
      list.innerHTML = eras.map(era => `
        <div class="era-item ${era.id === currentEraId ? 'active' : ''}" data-id="${era.id}">
          <div class="era-dot" style="background:${era.color}"></div>
          <div class="era-info">
            <div class="era-name">${era.name}</div>
            <div class="era-count">${era.tracks.length} tracks</div>
          </div>
        </div>
      `).join('');
      list.querySelectorAll('.era-item').forEach(el => {
        el.addEventListener('click', () => {
          currentEraId = el.dataset.id;
          renderEras();
          renderTracks();
        });
      });
    }

    function qualityClass(q) {
      if (!q) return 'quality-na';
      const lower = q.toLowerCase();
      if (lower.includes('lossless') || lower.includes('cd')) return 'quality-cd';
      if (lower.includes('high') || lower.includes('hq')) return 'quality-hq';
      if (lower.includes('low') || lower.includes('lq')) return 'quality-lq';
      if (lower.includes('record')) return 'quality-rec';
      return 'quality-na';
    }

    function renderTracks() {
      const era = eras.find(e => e.id === currentEraId);
      if (!era) return;
      document.getElementById('era-title').textContent = era.name;
      document.getElementById('era-sub').textContent = era.description || '';
      currentEraTracks = era.tracks;
      const body = document.getElementById('track-body');
      const empty = document.getElementById('empty-state');
      if (era.tracks.length === 0) {
        body.innerHTML = '';
        empty.style.display = 'flex';
        return;
      }
      empty.style.display = 'none';
      body.innerHTML = era.tracks.map((t, i) => `
        <tr class="track-row ${currentTrackIndex === i && isPlaying ? 'playing' : ''}" data-index="${i}">
          <td class="track-num">${i + 1}</td>
          <td>
            <div class="track-title-cell">
              <span class="track-title">${t.title}</span>
              <span class="track-notes" title="${(t.notes || '').replace(/"/g, '&quot;')}">${t.notes || ''}</span>
            </div>
          </td>
          <td><span class="type-badge">${t.type || '—'}</span></td>
          <td><span class="quality-badge ${qualityClass(t.quality)}">${t.quality || '—'}</span></td>
          <td class="track-meta">${t.length || '—'}</td>
          <td>
            <button class="play-btn" data-index="${i}" title="Play">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </button>
          </td>
        </tr>
      `).join('');
      body.querySelectorAll('.track-row').forEach(row => {
        row.addEventListener('click', (e) => {
          if (e.target.closest('.play-btn')) return;
          playTrack(parseInt(row.dataset.index));
        });
      });
      body.querySelectorAll('.play-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          playTrack(parseInt(btn.dataset.index));
        });
      });
    }

    function updateTotalCount() {
      const total = eras.reduce((sum, e) => sum + e.tracks.length, 0);
      document.getElementById('total-count').textContent = `${total} tracks`;
    }

    function playTrack(index) {
      const track = currentEraTracks[index];
      if (!track) return;
      currentTrackIndex = index;
      document.getElementById('player-title').textContent = track.title;
      document.getElementById('player-artist').textContent = `Leah Kate · ${track.type || 'Demo'}`;
      document.getElementById('player-art').textContent = track.title.charAt(0).toUpperCase();
      if (track.url) {
        audio.src = track.url;
        audio.play().then(() => {
          isPlaying = true;
          updatePlayIcon();
        }).catch(err => {
          console.warn('Playback issue (CORS / file may be down):', err);
          isPlaying = false;
          updatePlayIcon();
        });
      } else {
        audio.removeAttribute('src');
        isPlaying = false;
        updatePlayIcon();
        timeCurrent.textContent = '0:00';
        timeTotal.textContent = track.length || '0:00';
        progressFill.style.width = '0%';
      }
      renderTracks();
    }

    function togglePlay() {
      if (currentTrackIndex < 0) {
        if (currentEraTracks.length > 0) playTrack(0);
        return;
      }
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
      } else {
        audio.play().then(() => { isPlaying = true; }).catch(() => {});
      }
      updatePlayIcon();
      renderTracks();
    }

    function updatePlayIcon() {
      iconPlay.style.display = isPlaying ? 'none' : 'block';
      iconPause.style.display = isPlaying ? 'block' : 'none';
    }

    function formatTime(sec) {
      if (!sec || isNaN(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    function nextTrack() {
      if (currentEraTracks.length === 0) return;
      playTrack((currentTrackIndex + 1) % currentEraTracks.length);
    }

    function prevTrack() {
      if (currentEraTracks.length === 0) return;
      playTrack(currentTrackIndex <= 0 ? currentEraTracks.length - 1 : currentTrackIndex - 1);
    }

    btnPlay.addEventListener('click', togglePlay);
    document.getElementById('btn-next').addEventListener('click', nextTrack);
    document.getElementById('btn-prev').addEventListener('click', prevTrack);

    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
      timeCurrent.textContent = formatTime(audio.currentTime);
    });
    audio.addEventListener('loadedmetadata', () => {
      timeTotal.textContent = formatTime(audio.duration);
    });
    audio.addEventListener('ended', nextTrack);
    audio.addEventListener('play', () => { isPlaying = true; updatePlayIcon(); });
    audio.addEventListener('pause', () => { isPlaying = false; updatePlayIcon(); });

    progressBar.addEventListener('click', (e) => {
      if (!audio.duration) return;
      const rect = progressBar.getBoundingClientRect();
      audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
    });

    volumeSlider.addEventListener('input', () => { audio.volume = volumeSlider.value; });
    audio.volume = 0.85;

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
      else if (e.code === 'ArrowRight') nextTrack();
      else if (e.code === 'ArrowLeft') prevTrack();
    });

    renderEras();
    renderTracks();
    updateTotalCount();
  </script>
